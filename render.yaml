services:
  - type: web
    name: buildyourpc
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90 --keep-alive 5 --access-logfile - --error-logfile - backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: KO_FI_URL
        value: "https://ko-fi.com/simbawwyy00"
